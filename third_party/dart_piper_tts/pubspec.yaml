name: dart_piper_tts
description: "TTS in Dart using Piper TTS models + audio player in one package."
version: 0.2.6
repository: https://github.com/dikatok/flutter_piper_tts
topics: [tts, audio, dart]

environment:
  sdk: ^3.11.5

resolution: workspace

dependencies:
  code_assets: ^1.0.0
  ffi: ^2.2.0
  hooks: ^1.0.3
  native_toolchain_rust: ^1.0.4

dev_dependencies:
  ffigen: ^20.1.1
  lints: ^6.1.0
  test: ^1.28.0

ffigen:
  name: NativeLibrary
  output: lib/src/ffi.g.dart
  ffi-native:
    asset-id: "package:dart_piper_tts/src/ffi.g.dart"
  headers:
    entry-points:
      - rust/bindings.h
    include-directives:
      - rust/bindings.h
  functions:
    include:
      - ".*"
  unnamed-enums:
    exclude:
      - ".*"
  globals:
    exclude:
      - ".*"
  macros:
    exclude:
      - ".*"
  typedefs:
    exclude:
      - ".*"
