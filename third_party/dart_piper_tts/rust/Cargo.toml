[package]
name = "dart_piper_tts_native"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
log = "0.4.29"
ndarray = "0.17.2"
ort = "2.0.0-rc.12"
ringbuf = "0.4.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tinyaudio = "2.0.0"
unaccent = "0.1.1"
unicode-segmentation = "1.13.2"
rsepitran = { git = "https://github.com/dmort27/epitran.rs.git", package = "rsepitran", rev = "bbf50d2802953e0cb5fefc4328e07e326d1a49f4" }
cmudict-fast = "0.8.0"
regex = "1.12.3"

[build-dependencies]
cbindgen = "0.29.0"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[target.'cfg(any(target_os = "ios"))'.dependencies]
oslog = { version = "0.2.0", features = ["logger"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
env_logger = "0.11.10"

[lib]
crate-type = ["staticlib", "cdylib"]
